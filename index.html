function listCards(){const base=baseCards();return settings.scope==='stars'?base.filter(c=>settings.stars.includes(c.id)):base;}
function scopeLabel(){return settings.scope==='all'?'전체 카드':settings.scope==='stars'?'중요 카드':`${settings.chunk+1}구간 · ${settings.chunkSize}개씩`;}
function renderList(){const cards=listCards();app.innerHTML=`<main class="shell screen-enter">${topbar('나의 성어 노트','home',`<span class="tag">${cards.length}장</span>`)}<h1 class="page-title">차곡차곡, 내 성어.</h1><p class="page-subtitle">${settings.front.map(k=>FIELDS[k]).join(' + ')} 보고 ${settings.back.map(k=>FIELDS[k]).join(' + ')} 떠올리기</p><div class="mode-grid"><button class="mode-button" data-action="start" data-mode="memory"><span class="mode-symbol" aria-hidden="true">▱</span><strong>암기</strong><small>살짝 열고, 기억하기</small></button><button class="mode-button recall" data-action="start" data-mode="recall"><span class="mode-symbol" aria-hidden="true">✧</span><strong>리콜</strong><small>정답을 골라 확인하기</small></button></div><div class="toolbar"><button class="range-button" data-action="scope" aria-label="학습 범위 설정">${scopeLabel()} <span aria-hidden="true">⌄</span></button><label class="toggle-label">가리는 학습 보기 <button class="switch" role="switch" aria-label="가리는 학습 보기" aria-checked="${showBack}" data-action="show-back"></button></label></div>${settings.scope==='chunks'?`<nav class="chunk-tabs" aria-label="학습 구간">${Array.from({length:Math.ceil(CARDS.length/settings.chunkSize)},(_,i)=>`<button class="chunk-tab" data-action="chunk" data-index="${i}" aria-pressed="${settings.chunk===i}">${i*settings.chunkSize+1}–${Math.min((i+1)*settings.chunkSize,CARDS.length)}</button>`).join('')}</nav>`:''}<div class="list-meta"><span>${showBack?'앞면과 뒷면을 함께 보고 있어요':'카드를 누르면 뒤집혀요'}</span><span>별표 ${settings.stars.length}장</span></div><section class="card-list" aria-label="성어 카드">${cards.length?cards.map(cardMarkup).join(''):'<div class="empty"><strong>아직 별표가 없어요</strong><p>전체 목록에서 기억하고 싶은<br>카드에 별을 눌러 주세요.</p><button class="secondary" data-action="all-cards">전체 카드 보기</button></div>'}</section><p class="footer-note">${cards.length?'여기까지, '+cards.length+'장의 성어.':'별표는 언제든 바꿀 수 있어요.'}</p></main>`;}
function cardMarkup(c){const isFlipped=!showBack&&flipped.has(c.id);return `<article class="study-card${isFlipped?' flipped':''}" data-card="${c.id}"><button class="star" data-action="star" data-id="${c.id}" aria-label="${c.reading} 중요 카드" aria-pressed="${settings.stars.includes(c.id)}">${settings.stars.includes(c.id)?'★':'☆'}</button><button class="flip" ${showBack?'disabled':''} data-action="flip" data-id="${c.id}" aria-label="카드 ${c.id} ${isFlipped?'앞면':'뒷면'} 보기"><span class="flip-inner"><span class="face-front" aria-hidden="${isFlipped}">${fields(c,settings.front)}</span><span class="face-back" aria-hidden="${!isFlipped}">${fields(c,settings.back)}</span></span></button>${showBack?`<div class="revealed">${fields(c,settings.back)}</div>`:''}</article>`;}
function openDialog(markup){dialogReturn=document.activeElement;dialog.innerHTML=`<div class="modal-content">${markup}</div>`;if(!dialog.open)dialog.showModal();}
function closeDialog(){dialog.close();if(dialogReturn?.isConnected)dialogReturn.focus({preventScroll:true});}
function dialogHeading(title){return `<div class="modal-heading"><h2>${title}</h2><button class="icon-button" data-action="close-dialog" aria-label="닫기">×</button></div>`;}
function openScope(){openDialog(`${dialogHeading('학습 범위')}<p>오늘 공부할 만큼만 골라요.</p><form id="scope-form"><div class="radio-stack">${[['all','전체 카드 학습'],['stars','중요 카드 ★ 학습'],['chunks','구간 단위로 학습']].map(([value,label])=>`<label class="radio-option"><input type="radio" name="scope" value="${value}" ${settings.scope===value?'checked':''}>${label}</label>`).join('')}</div><div class="range-setting"><label for="chunk-size">한 구간의 카드 <output id="chunk-output">${settings.chunkSize}개</output></label><input id="chunk-size" type="range" min="5" max="28" value="${settings.chunkSize}" aria-label="구간별 카드 개수"><div class="range-ends"><span>5개</span><span>전체 28개</span></div></div><button class="primary animated" type="submit">저장하기</button></form>`);$('#chunk-size').addEventListener('input',e=>{$('#chunk-output').textContent=e.target.value+'개';$('input[value="chunks"]',dialog).checked=true;});$('#scope-form').addEventListener('submit',e=>{e.preventDefault();settings.scope=new FormData(e.target).get('scope');settings.chunkSize=Number($('#chunk-size').value);settings.chunk=Math.min(settings.chunk,Math.ceil(28/settings.chunkSize)-1);save();closeDialog();renderList();});}
function requestStart(mode){listScroll=window.scrollY;const base=baseCards(),starred=base.filter(c=>settings.stars.includes(c.id));if(settings.scope==='stars'){if(!starred.length){openDialog(`${dialogHeading('중요 카드를 골라 주세요')}<p>아직 별표가 없어요. 전체 목록에서 별을 누르면 중요 카드만 학습할 수 있어요.</p><div class="choice-stack"><button class="primary" disabled>중요 카드 학습 · 0장</button><button class="secondary" data-action="all-cards">전체 카드 보기</button></div>`);return;}startSession(mode,starred);return;}if(settings.stars.length){openDialog(`${dialogHeading('어떤 카드를 볼까요?')}<p>${mode==='memory'?'암기':'리콜'} · ${settings.scope==='chunks'?scopeLabel():'나의 성어 노트'}</p><div class="choice-stack"><button class="secondary" data-action="start-choice" data-mode="${mode}" data-scope="all">${settings.scope==='chunks'?'이 구간 전체':'전체 카드'}<small>${base.length}장 차근차근 학습하기</small></button><button class="secondary" data-action="start-choice" data-mode="${mode}" data-scope="stars" ${!starred.length?'disabled':''}>중요 카드 ★<small>${starred.length?starred.length+'장 집중해서 학습하기':'이 구간에는 별표 카드가 없어요'}</small></button></div>`);}else startSession(mode,base);}
function startSession(mode,cards){if(!cards.length){toast('학습할 카드가 없어요.');return;}if(dialog.open)closeDialog();session={results:[],covers:[],mode,queue:[...cards],index:0,passed:0,missed:[],round:1,answered:false,cover:0,options:[],front:[...settings.front],back:[...settings.back]};prepareCard();setView('session');}
function shuffle(items){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
const normalize=s=>s.replace(/[\s.,·/()（）]/g,'');
function signature(c,keys){return keys.map(k=>normalize(c[k])).join('\u0001');}
function makeOptions(card,front,back){const answer=signature(card,back);const validAnswers=new Set(CARDS.filter(c=>signature(c,front)===signature(card,front)).map(c=>signature(c,back)));const seen=new Set(validAnswers);const others=shuffle(CARDS).filter(c=>{const sig=signature(c,back);if(seen.has(sig))return false;seen.add(sig);return true;}).slice(0,3);return shuffle([{card,correct:true,key:answer},...others.map(c=>({card:c,correct:false,key:signature(c,back)}))]);}
function prepareCard(){session.answered=false;session.cover=session.mode==='memory'?(session.covers[session.index]||0):0;session.options=session.mode==='recall'?makeOptions(session.queue[session.index],session.front,session.back):[];}
function renderSession(){const s=session,c=s.queue[s.index],memory=s.mode==='memory',long=s.back.some(k=>['literal','meaning','sounds'].includes(k))||s.back.length>1;app.innerHTML=`<main class="shell session-shell screen-enter">${topbar(s.round===1?'차근차근 학습 중':`${s.round}회차 · 다시 익히기`,'exit',`<span class="tag">${s.index+1}번째 카드</span>`)}<div class="session-heading"><h1>${memory?'기억을 꺼내 볼까요?':'어떤 뜻일까요?'}</h1><span id="feedback" class="feedback" role="status" hidden></span></div><div class="progress-line"><span>${memory?'완료한 카드':'맞춘 카드'}</span><strong class="progress-count" id="progress-count">${s.passed}<span> | ${s.queue.length}</span></strong></div><div class="progress-track" role="progressbar" aria-label="이번 회차 학습 진행" aria-valuenow="${s.index}" aria-valuemin="0" aria-valuemax="${s.queue.length}"><div class="progress-fill" style="width:${s.index/s.queue.length*100}%"></div></div><section class="question-card" aria-label="보이는 학습">${fields(c,s.front)}</section>${memory?`<p class="session-caption">아래 버튼으로 커버를 열어 확인해요.</p><section class="answer-well"><div class="answer-content" aria-hidden="true" inert>${fields(c,s.back)}</div><div class="cover" role="slider" tabindex="0" aria-label="정답 커버 · 아래로 내려서 열기" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="완전히 가려짐" aria-orientation="vertical"><div class="cover-handle"></div><div class="cover-hint"><strong>먼저 가리고<br>기억해 보세요.</strong><small>생각이 안나면 커버 열기를 눌러<br>확인하고 다음 카드로 넘기세요!</small></div></div></section>`:`<p class="session-caption">알맞은 답을 하나 골라 주세요.</p><section class="options ${long?'long-options':''}" aria-label="정답 보기">${s.options.map((o,i)=>`<button class="answer-option" data-action="answer" data-index="${i}" aria-label="${i+1}번 ${s.back.map(k=>o.card[k]).join(', ')}"><div class="option-fields">${fields(o.card,s.back)}</div></button>`).join('')}</section>`}<footer class="session-bottom"><div class="session-actions ${memory?'memory-actions':''}">${memory?'<button class="secondary" data-action="cover-toggle" aria-expanded="false">커버 열기</button>':''}<button class="primary animated" data-action="next" ${memory?'':'disabled'}>다음 →</button></div></footer></main>`;if(memory){wireCover();setCover(s.cover);}}

function setCover(value){session.cover=Math.max(0,Math.min(100,value));const cover=$('.cover'),well=$('.answer-well');if(!cover||!well)return;const open=session.cover>=99.5;const toggle=$('[data-action="cover-toggle"]');if(toggle){toggle.textContent=open?'다시 덮기':'커버 열기';toggle.setAttribute('aria-expanded',String(open));}if(open)session.cover=100;cover.style.transform=`translateY(${(well.clientHeight-65)*session.cover/100}px)`;cover.classList.toggle('open',open);cover.setAttribute('aria-valuenow',Math.round(session.cover));cover.setAttribute('aria-valuetext',open?'완전히 열림':session.cover===0?'완전히 가려짐':`${Math.round(session.cover)}% 열림`);$('.answer-content').setAttribute('aria-hidden',String(!open));$('.answer-content').inert=!open;$('.cover-hint').innerHTML=open?'아는 게 아니면 다시 덮어요.':'<strong>먼저 가리고<br>기억해 보세요.</strong><small>생각이 안나면 커버 열기를 눌러<br>확인하고 다음 카드로 넘기세요!</small>';}
function wireCover(){const cover=$('.cover'),well=$('.answer-well');let drag=null,timer;
const settle=()=>{cover.classList.add('spring');setCover(session.cover===100?100:0);};
cover.addEventListener('pointerdown',e=>{if(e.button!==0)return;clearTimeout(timer);cover.classList.remove('spring');drag={x:e.clientX,y:e.clientY,value:session.cover};cover.setPointerCapture(e.pointerId);cover.focus({preventScroll:true});e.preventDefault();});
cover.addEventListener('pointermove',e=>{if(drag&&Math.abs(e.clientY-drag.y)>=Math.abs(e.clientX-drag.x))setCover(drag.value+(e.clientY-drag.y)/(well.clientHeight-65)*100);});
const release=()=>{if(!drag)return;drag=null;settle();};cover.addEventListener('pointerup',release);cover.addEventListener('pointercancel',release);cover.addEventListener('lostpointercapture',release);
cover.addEventListener('keydown',e=>{const steps={ArrowDown:10,ArrowUp:-10,PageDown:25,PageUp:-25};if(e.key in steps){e.preventDefault();cover.classList.remove('spring');setCover(session.cover+steps[e.key]);}else if(e.key==='Home'||e.key==='End'){e.preventDefault();setCover(e.key==='End'?100:0);}});cover.addEventListener('keyup',e=>{if(['ArrowDown','ArrowUp','PageDown','PageUp','Home','End'].includes(e.key))settle();});
cover.addEventListener('wheel',e=>{e.preventDefault();clearTimeout(timer);cover.classList.remove('spring');setCover(session.cover+e.deltaY*.2);timer=setTimeout(()=>{if(cover.isConnected)settle();},180);},{passive:false});}
function answer(index){if(!session||session.answered)return;const choice=session.options[index];if(!choice)return;session.answered=true;if(choice.correct)session.passed++;else session.missed.push(session.queue[session.index]);document.querySelectorAll('.answer-option').forEach((b,i)=>{b.disabled=true;b.classList.add(session.options[i].correct?'correct':i===index?'wrong':'dimmed');if(session.options[i].correct)b.setAttribute('aria-label','정답 · '+b.getAttribute('aria-label'));});const feedback=$('#feedback');feedback.hidden=false;feedback.textContent=choice.correct?'정답!':'다음에 다시 시도!';$('#progress-count').innerHTML=`${session.passed}<span> | ${session.queue.length}</span>`;$('[data-action="next"]').disabled=false;$('.session-bottom').insertAdjacentHTML('afterbegin',reference(session.queue[session.index],session.back));}
function nextCard(){if(session.mode==='recall'&&!session.answered)return;if(session.mode==='memory'){session.covers[session.index]=session.cover;session.results[session.index]=session.cover===100;session.passed=session.results.filter(Boolean).length;session.missed=session.queue.filter((c,i)=>session.results[i]===false);}session.index++;if(session.index===session.queue.length){setView(session.missed.length?'round':'complete');return;}prepareCard();setView('session');}
function renderRound(){const done=view==='complete';app.innerHTML=`<main class="shell screen-enter">${topbar(done?'학습 완료':'한 번 더 익혀요','exit')}<section class="round-screen">${sprout()}<h1>${done?'완벽해요!':'조금만 더, 내 것으로.'}</h1><p>${done?'모든 카드를 끝까지 익혔어요.<br>차곡차곡 쌓인 기억, 잘했어요.':`아직 남은 <strong>${session.missed.length}장</strong>만 다시 볼게요.<br>서두르지 않아도 괜찮아요.`}</p><span class="round-badge">${session.passed} / ${session.queue.length}장 ${session.mode==='memory'?'완료':'정답'}</span><button class="primary animated" data-action="${done?'return-list':'retry'}">${done?'성어 노트로':'남은 카드 다시 학습하기'} <span aria-hidden="true">→</span></button>${done?'<p class="completion-timer">잠시 후 성어 노트로 돌아가요.</p>':''}</section></main>`;if(done)completionTimer=setTimeout(()=>{session=null;setView('list',true);},3000);}
function exitSession(){if(view==='complete'){session=null;setView('list',true);return;}openDialog(`${dialogHeading('잠깐 쉬어 갈까요?')}<p>별과 학습 설정은 유지돼요.<br>이번 학습은 다음에 처음부터 시작해요.</p><div class="dialog-actions"><button class="secondary" data-action="close-dialog">계속 학습</button><button class="primary" data-action="return-list">목록으로</button></div>`);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='field'){const selection=b.dataset.side==='front'?draftFront:draftBack,key=b.dataset.key,i=selection.indexOf(key);if(i>=0){if(selection.length===1){toast('각 면에 하나 이상 골라 주세요.');return;}selection.splice(i,1);}else{if(selection.length===2){toast('각 면에는 두 개까지 고를 수 있어요.');return;}selection.push(key);}renderHome();$(`[data-action="field"][data-side="${b.dataset.side}"][data-key="${key}"]`).focus({preventScroll:true});}
else if(action==='apply'){settings.front=[...draftFront];settings.back=[...draftBack];save();flipped.clear();setView('list');}
else if(action==='home'){draftFront=[...settings.front];draftBack=[...settings.back];setView('home');}
else if(action==='flip'){if(showBack)return;const id=Number(b.dataset.id),article=b.closest('.study-card');if(flipped.has(id))flipped.delete(id);else flipped.add(id);const on=flipped.has(id);article.classList.toggle('flipped',on);b.setAttribute('aria-label',`카드 ${id} ${on?'앞면':'뒷면'} 보기`);$('.face-front',b).setAttribute('aria-hidden',String(on));$('.face-back',b).setAttribute('aria-hidden',String(!on));}
else if(action==='star'){const id=Number(b.dataset.id),i=settings.stars.indexOf(id);if(i>=0)settings.stars.splice(i,1);else settings.stars.push(id);save();if(settings.scope==='stars'){renderList();}else{b.textContent=i>=0?'☆':'★';b.setAttribute('aria-pressed',String(i<0));$('.list-meta span:last-child').textContent=`별표 ${settings.stars.length}장`;}}
else if(action==='show-back'){showBack=!showBack;if(showBack)flipped.clear();const y=window.scrollY;renderList();window.scrollTo(0,y);$('[data-action="show-back"]').focus({preventScroll:true});}
else if(action==='scope')openScope();
else if(action==='close-dialog')closeDialog();
else if(action==='chunk'){settings.chunk=Number(b.dataset.index);save();flipped.clear();renderList();}
else if(action==='all-cards'){settings.scope='all';save();if(dialog.open)closeDialog();setView('list');}
else if(action==='start')requestStart(b.dataset.mode);
else if(action==='start-choice'){const cards=baseCards().filter(c=>b.dataset.scope==='all'||settings.stars.includes(c.id));startSession(b.dataset.mode,cards);}
else if(action==='answer')answer(Number(b.dataset.index));
else if(action==='cover-toggle'){$('.cover').classList.add('spring');setCover(session.cover===100?0:100);}
else if(action==='next')nextCard();
else if(action==='exit')exitSession();
else if(action==='return-list'){if(dialog.open)closeDialog();session=null;setView('list',true);}
else if(action==='retry'){session.queue=[...session.missed];session.results=[];session.covers=[];session.missed=[];session.index=0;session.passed=0;session.round++;prepareCard();setView('session');}
});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
let viewportFrame;
function fitViewport(){cancelAnimationFrame(viewportFrame);viewportFrame=requestAnimationFrame(()=>{const height=Math.floor(window.visualViewport?.height||window.innerHeight);document.documentElement.style.setProperty('--visible-height',height+'px');document.documentElement.classList.toggle('short-viewport',height<700);if(view==='session'&&session.mode==='memory')setCover(session.cover);});}
window.addEventListener('resize',fitViewport);window.visualViewport?.addEventListener('resize',fitViewport);fitViewport();
render();

</script>
<!-- SCRIPT_END -->
</body>
</html>
